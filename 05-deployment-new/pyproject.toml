[project]
name = "05-deployment-new"
version = "0.1.0"
description = "Churn prediction service"
readme = "README.md"
authors = [
    { name = "shanshanhemasao", email = "75049804+shanshanhemasao@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy==2.3.1",
    "pandas==2.3.1",
    "scikit-learn==1.7.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
05-deployment-new = "05_deployment_new:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requests>=2.34.2",
]
